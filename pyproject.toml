[project]
name = "rag"
version = "0.1.0"
description = "Grade 12 Llama RAG tutor - open source, local embeddings + Llama"
readme = "README.md"
authors = [
    { name = "Lovemore", email = "lovemorengubane@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]
